name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release increment type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_existing:
        description: Publish the version already recorded in package.json without bumping it
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify package
        run: npm run ci

      - name: Bump version and update changelog
        if: ${{ !inputs.publish_existing }}
        run: |
          npm version "${{ github.event.inputs.release_type }}" -m "chore(release): %s"

      - name: Publish to npm
        run: npm publish --access public
